<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Google Analytics (GA4) -->

  <script>
    window.dataLayer = window.dataLayer || [];

    gtag('js', new Date());
    gtag('config', 'G-DG91V2795Q');

  <!-- Primary SEO -->
  <title>EMI Calculator India – Home, Car & Personal Loan EMI Calculator</title>
  <meta name="description" content="Free EMI Calculator for India. Calculate Home Loan, Car Loan and Personal Loan EMI instantly with interest rate and tenure. Simple and accurate EMI calculation." />

  <!-- SEO Best Practices -->
  <meta name="robots" content="index, follow" />
  <meta name="geo.region" content="IN" />
  <meta name="geo.country" content="India" />

  <!-- Open Graph (Social Sharing) -->
  <meta property="og:title" content="EMI Calculator India – Calculate Loan EMI Easily" />
  <meta property="og:description" content="Calculate EMI for home loan, car loan and personal loan in India. Free, fast and accurate EMI calculator." />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="container">
    <h1>EMI Calculator India</h1>
    <p>Calculate your monthly EMI for Home Loan, Car Loan or Personal Loan easily.</p>

    <div class="calculator-box">

      <label for="loanAmount">Loan Amount (₹)</label>
      <input type="number" id="loanAmount" placeholder="e.g. 500000" />

      <label for="interestRate">Interest Rate (% per year)</label>
      <input type="number" step="0.01" id="interestRate" placeholder="e.g. 8.5" />

      <label for="loanTenure">Loan Tenure (Years)</label>
      <input type="number" id="loanTenure" placeholder="e.g. 20" />

      <button onclick="calculateEMI()">Calculate EMI</button>

      <div class="result">
        <p><strong>Monthly EMI:</strong> <span id="emiResult">₹0</span></p>
        <p><strong>Total Interest:</strong> <span id="totalInterest">₹0</span></p>
        <p><strong>Total Payment:</strong> <span id="totalPayment">₹0</span></p>
      </div>

    </div>

    <footer>
      <p>© 2026 EMI Calculator India. Free Financial Tool.</p>
    </footer>
  </div>

  <!-- JS -->
  <script src="script.js"></script>
</body>
