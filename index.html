<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- GA4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DG91V2795Q"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-DG91V2795Q');
</script>

<title>Home Loan EMI Calculator India (RBI Formula)</title>
<meta name="description" content="Professional Home Loan EMI Calculator India. See EMI, interest, smart loan insights, inflation impact and download PDF report." />

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Arial,sans-serif;background:#f3f6fb;margin:0;padding:20px}
.container{max-width:1200px;margin:auto;background:#fff;padding:20px;border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,0.08)}
h1{text-align:center;margin-bottom:5px}
.subtitle{text-align:center;color:#555}

/* HERO */
.hero{display:flex;gap:20px;margin-top:25px;flex-wrap:wrap}
.card{flex:1;background:#f8fafc;padding:20px;border-radius:10px;text-align:center}
.card h4{margin:0;font-size:14px;color:#666}
.card .value{font-size:34px;font-weight:bold;margin-top:8px}
.card.interest .value{color:#d84315}
.card.payment .value{color:#0d47a1}

/* INPUTS */
.inputs label{font-weight:bold;margin-top:15px;display:block}
input,button{width:100%;padding:10px;margin-top:6px;font-size:16px}
button{background:#1a73e8;color:#fff;border:none;border-radius:6px;cursor:pointer}

/* SECTIONS */
.section{margin-top:30px;background:#f8fafc;padding:20px;border-radius:10px}
.highlight{font-size:22px;font-weight:bold;color:#0f9d58}

/* TABLE */
table{width:100%;border-collapse:collapse;margin-top:15px;font-size:14px}
th,td{border:1px solid #ccc;padding:8px;text-align:right}
th{background:#f0f0f0;position:sticky;top:0}

/* MISC */
.actions{display:flex;gap:15px;flex-wrap:wrap}
.actions button{flex:1;background:#0f9d58}
.actions button.share{background:#25d366}
footer{text-align:center;margin-top:40px;color:#666;font-size:13px}

@media(max-width:768px){
.hero,.actions{flex-direction:column}
}
</style>
</head>

<body>
<div class="container">

<h1>Home Loan EMI Calculator India</h1>
<p class="subtitle">RBI Formula • Smart Insights • Inflation Impact</p>

<!-- INPUTS -->
<div class="inputs">
<label>Loan Amount (₹)</label>
<input id="amount" type="number" value="4000000">

<label>Interest Rate (% per year)</label>
<input id="rate" type="number" value="8">

<label>Loan Tenure (Years)</label>
<input id="tenure" type="number" value="20">

<button onclick="calculateEMI()">Calculate EMI</button>
</div>

<!-- HERO DASHBOARD -->
<div class="hero" id="hero" style="display:none">
  <div class="card">
    <h4>Monthly EMI</h4>
    <div class="value" id="emiValue"></div>
  </div>
  <div class="card interest">
    <h4>Total Interest</h4>
    <div class="value" id="interestValue"></div>
  </div>
  <div class="card payment">
    <h4>Total Amount (P + I)</h4>
    <div class="value" id="paymentValue"></div>
  </div>
</div>

<!-- CHART -->
<div class="section" id="chartSection" style="display:none">
<h3>Principal vs Interest</h3>
<canvas id="emiChart"></canvas>
</div>

<!-- SMART INSIGHTS -->
<div class="section" id="insightSection" style="display:none">
<h3>🧠 Smart Loan Insight</h3>
<p id="pizzaInsight"></p>
<p class="highlight" id="inflationInsight"></p>
</div>

<!-- ACTIONS -->
<div class="section actions" id="actionSection" style="display:none">
<button onclick="downloadPDF()">Download Loan Report (PDF)</button>
<button class="share" onclick="shareWhatsApp()">Share with Family (WhatsApp)</button>
</div>

<!-- COMPARISON -->
<div class="section" id="compareSection" style="display:none">
<h3>Interest Rate Comparison</h3>
<label>Compare with another interest rate (%)</label>
<input id="otherRate" type="number" value="9">
<button onclick="compareRate()">Compare</button>
<p class="highlight" id="compareResult"></p>
</div>

<!-- TABLE -->
<div class="section" id="tableSection" style="display:none">
<h3>Amortization Schedule</h3>
<table>
<thead>
<tr><th>Month</th><th>EMI</th><th>Principal</th><th>Interest</th><th>Balance</th></tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<footer>© 2026 Home Loan EMI Calculator India</footer>
</div>

<script>
let chart, EMI, TOTAL, INTEREST;

function calculateEMI(){
  const P=+amount.value;
  const r=+rate.value/12/100;
  const n=+tenure.value*12;

  EMI=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  TOTAL=EMI*n;
  INTEREST=TOTAL-P;

  hero.style.display=chartSection.style.display=
  insightSection.style.display=actionSection.style.display=
  compareSection.style.display=tableSection.style.display="block";

  emiValue.innerText="₹"+EMI.toFixed(0);
  interestValue.innerText="₹"+INTEREST.toFixed(0);
  paymentValue.innerText="₹"+TOTAL.toFixed(0);

  // Smart Insight
  pizzaInsight.innerText=
  `If you pay just ₹500 extra every month (one pizza's cost),
   your loan can finish around 2 years earlier and save lakhs in interest.`;

  // Inflation Insight (6% assumed)
  const futureValue=(EMI/Math.pow(1.06,10)).toFixed(0);
  inflationInsight.innerText=
  `Today's EMI of ₹${EMI.toFixed(0)} may feel like ~₹${futureValue}
   after 10 years due to inflation.`;

  // Table
  tbody.innerHTML="";
  let bal=P;
  for(let i=1;i<=n;i++){
    let int=bal*r, princ=EMI-int;
    bal-=princ;
    tbody.innerHTML+=
    `<tr><td>${i}</td><td>${EMI.toFixed(0)}</td>
     <td>${princ.toFixed(0)}</td><td>${int.toFixed(0)}</td>
     <td>${bal>0?bal.toFixed(0):0}</td></tr>`;
  }

  // Chart
  if(chart) chart.destroy();
  chart=new Chart(emiChart,{
    type:'pie',
    data:{labels:['Principal','Interest'],
    datasets:[{data:[P,INTEREST],
    backgroundColor:['#2e7d32','#ff7043']}]}
  });

  gtag('event','emi_calculated');
}

function compareRate(){
  const r2=+otherRate.value/12/100;
  const n=+tenure.value*12;
  const emi2=amount.value*r2*Math.pow(1+r2,n)/(Math.pow(1+r2,n)-1);
  const total2=emi2*n;
  compareResult.innerText=`You save ₹${(total2-TOTAL).toFixed(0)} by choosing lower rate`;
  gtag('event','compare_clicked');
}

function downloadPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  doc.text("Home Loan EMI Summary",14,15);
  doc.text(`Monthly EMI: ₹${EMI.toFixed(0)}`,14,30);
  doc.text(`Total Interest: ₹${INTEREST.toFixed(0)}`,14,38);
  doc.text(`Total Payment: ₹${TOTAL.toFixed(0)}`,14,46);
  doc.text("Generated from Home Loan EMI Calculator India",14,60);
  doc.save("home-loan-report.pdf");
  gtag('event','pdf_downloaded');
}

function shareWhatsApp(){
  const text=
  `My home loan EMI is ₹${EMI.toFixed(0)}.
Small changes can save lakhs.
Check this calculator: ${window.location.href}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
  gtag('event','whatsapp_shared');
}
</script>

</body>
</html>
